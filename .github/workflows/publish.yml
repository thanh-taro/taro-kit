# Publish (ADR-0007, MOD-Delivery, D-046, D-047). What was gated is what is deployed: one build per run, passed to
# the deploy job as an artifact.
#   push to main:        every gate, then a production deploy to https://tarokit.app (ADR-0007 as written, D-047).
#   workflow_dispatch:   target=staging deploys https://staging.tarokit.app (D-046, manual only);
#                        target=production deploys production by hand. Deploys run only from main.
#
# Secrets: CLOUDFLARE_API_TOKEN (Account / Workers Scripts / Edit only) and CLOUDFLARE_ACCOUNT_ID, stored in the
# GitHub environments `staging` and `production` and read only by the Deploy step.
# A push deploys only once CLOUDFLARE_API_TOKEN exists in the `production` environment. Until then the
# production deploy is skipped with a notice and the run stays green, so the repo can be pushed and staging
# checked first (release checklist). A manual deploy (either target) with a missing secret fails with an error.
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false # never cancel a deploy half way

env:
  ASTRO_TELEMETRY_DISABLED: '1'
  # A push always targets production; a manual run targets what was chosen.
  TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}

jobs:
  # The pull-request gate (ci.yml): spec lint, token contrast, generated files, lint, astro check, licenses, unit
  # tests, the production build with its guards, Chromium e2e and axe.
  checks:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # NFR-10: the other engines. WebKit blocks the deploy; Firefox reports only until it has been green once on
  # GitHub (D-044: Firefox is also a manual check on staging).
  e2e-engines:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [webkit, firefox]
    continue-on-error: ${{ matrix.project == 'firefox' }}
    steps:
      # Actions are pinned by commit SHA (DEP-29).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Python build tools (font subsetting, DEP-42, DEP-43)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-build.txt
      - name: Install ${{ matrix.project }}
        run: pnpm exec playwright install --with-deps "$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}
      # Playwright builds dist-samples/ and dist-fixtures/ itself (adapters/tests.md).
      - name: E2E (${{ matrix.project }})
        run: pnpm exec playwright test --project="$PROJECT"
        env:
          PROJECT: ${{ matrix.project }}

  # F-014.R1, F-014.R2: the blocking catalog check, against the production portal origin for every target.
  catalog-gate:
    permissions:
      contents: read
    uses: ./.github/workflows/catalog-check.yml
    with:
      pre_deploy: true

  build:
    needs: [checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Python build tools (font subsetting, DEP-42, DEP-43)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-build.txt

      # Both scripts validate content, build, write the service worker and run the font and dist-clean checks.
      - name: Build (${{ env.TARGET }})
        run: |
          if [ "$TARGET" = staging ]; then pnpm build:staging; else pnpm build; fi

      - name: Dist-clean gate (no tests-only pages or fixture content)
        run: node scripts/check-dist-clean.ts

      - name: The build has the host files
        run: test -f dist/_headers && test -f dist/404.html && test -f dist/sw.js

      - name: Staging build names only the staging origin
        if: env.TARGET == 'staging'
        run: |
          grep -q 'https://staging.tarokit.app/' dist/index.html
          if grep -rIl 'https://tarokit.app' dist --include='*.html' --include='*.xml' --include='*.webmanifest' --include='robots.txt'; then
            echo "::error::The staging build names the production origin in the files above"
            exit 1
          fi

      - name: Production build names the production origin and carries no sample content
        if: env.TARGET == 'production'
        run: |
          grep -q 'https://tarokit.app/' dist/index.html
          if grep -rIl 'sample-' dist --include='*.html' --include='*.xml' --include='*.json'; then
            echo "::error::Sample content is still in content/ (release checklist U-1); it is never deployed to production"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ env.TARGET }}
          path: dist
          retention-days: 7
          if-no-files-found: error

  deploy-staging:
    needs: [checks, e2e-engines, catalog-gate, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.target == 'staging'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: staging
      url: https://staging.tarokit.app
    steps:
      - name: Require the Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Missing secret::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the 'staging' environment (release checklist U-10)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      # wrangler only; no dependency lifecycle script runs next to the token.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-staging
          path: dist
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec wrangler deploy --env staging --message "${GITHUB_SHA}"

  deploy-production:
    needs: [checks, e2e-engines, catalog-gate, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.target == 'production')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    environment:
      name: production
      url: https://tarokit.app
    outputs:
      deployed: ${{ steps.deploy.outcome == 'success' }}
    steps:
      # D-047: a push before the secret exists skips the deploy with a notice; a manual run fails.
      - name: Check the Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "::notice title=Production deploy skipped::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set in the 'production' environment. Every gate passed; add the secrets at go-live (release checklist U-17)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error title=Missing secret::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the 'production' environment (release checklist U-17)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.secrets.outputs.ready == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.secrets.outputs.ready == 'true'
        with:
          name: dist-production
          path: dist
      - name: Deploy
        id: deploy
        if: steps.secrets.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: pnpm exec wrangler deploy --message "${GITHUB_SHA}"

  # MOD-Delivery post-deploy smoke test: status, security headers (CSP frame-ancestors, HSTS, Permissions-Policy),
  # no Set-Cookie, a real 404, sw.js no-cache, the host's sitemap, no external scripts. No secrets.
  # A failure does not roll back; the failed-workflow email tells the Owner (release checklist, Rollback).
  smoke-staging:
    needs: [deploy-staging]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke test (staging.tarokit.app)
        run: scripts/smoke-test.sh staging.tarokit.app

  smoke-production:
    needs: [deploy-production]
    if: needs.deploy-production.outputs.deployed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Smoke test (tarokit.app)
        run: scripts/smoke-test.sh tarokit.app
