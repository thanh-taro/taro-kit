# Catalog check (F-014, MOD-CatalogCheck, ADR-0007). `pnpm catalog:check` exits 1 when a visible tool is
# unreachable or an embedded tool refuses the portal (RULE-12); profile links only warn.
#   weekly:     runs against main (the published content); a failure fails the run, and GitHub's
#               failed-workflow email notifies the Owner (F-014.R5). It never deploys.
#   pre-deploy: called by publish.yml so the deploy job can `needs:` it (F-014.R1, F-014.R2).
#
# Secrets: none are used here. Only publish.yml's deploy steps read CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
name: catalog-check

on:
  schedule:
    - cron: '17 3 * * 1' # weekly, Monday 03:17 UTC
  workflow_dispatch:
  # In a called workflow, github.event_name is the caller's event (push), never 'workflow_call', so the
  # jobs tell the two modes apart by this input, which is only set when publish.yml calls the workflow.
  workflow_call:
    inputs:
      pre_deploy:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  weekly:
    if: ${{ !inputs.pre_deploy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false # QA I-4: the job token isn't left in .git/config
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Catalog check (weekly)
        run: pnpm catalog:check --weekly

  pre-deploy:
    if: ${{ inputs.pre_deploy }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # QA I-4
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Catalog check (blocks the publish)
        run: pnpm catalog:check
