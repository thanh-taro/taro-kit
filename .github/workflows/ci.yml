# Pull-request gate (ADR-0007, MOD-Delivery). publish.yml calls it (workflow_call) as its `checks` job, then adds
# the other engines, the catalog check and the deploy.
name: ci

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      # Actions are pinned by commit SHA (DEP-29).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # QA I-4: the job token isn't left in .git/config
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Python build tools (font subsetting, DEP-42, DEP-43)
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet -r requirements-build.txt

      - name: Spec lint
        run: python3 tools/spec_lint.py

      - name: Token contrast (NFR-03)
        run: python3 tools/token_contrast.py

      - name: Generate
        run: pnpm gen

      - name: Generated files are committed and fresh
        run: |
          pnpm gen:check
          git diff --exit-code -- src/generated

      - name: Lint and format
        run: pnpm lint

      - name: Type check
        run: pnpm exec astro check

      - name: License check (ADR-0008, scope from dependencies.md)
        run: pnpm licenses:check

      - name: Unit tests
        run: pnpm test

      # Content validation, astro build, then the dist/ font-subset check (ADR-0003).
      - name: Build
        run: pnpm build

      - name: Font subsets in dist/
        run: pnpm fonts:check

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E + axe (Chromium)
        run: pnpm exec playwright test --project=chromium

      - name: Acceptance-criteria coverage (report only)
        if: always()
        run: python3 tools/spec_lint.py --coverage tests/ | tail -n 40 >> "$GITHUB_STEP_SUMMARY"
