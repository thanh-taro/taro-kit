<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tool view, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--accent2:#FFB870;--tint:#251A3C}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--accent2:#B85E08;--tint:#EEE7FE}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div class="{{themeCls}}" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">
  <div role="toolbar" aria-label="JSON Formatter tool" style="display: flex; align-items: center; gap: 2px; min-height: 56px; padding: 0 4px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <a href="#" aria-label="Back" data-copy="COPY-tool.back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <span style="width: 26px; height: 26px; flex: none; border-radius: 7px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 12px 'JetBrains Mono', monospace">{ }</span>
    <h1 style="margin: 0 0 0 8px; font: 600 15px Manrope, sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">JSON Formatter</h1>
    <button type="button" aria-label="Remove from favorites" aria-pressed="true" data-copy="COPY-fav.remove" style="margin-left: auto; width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--accent2)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2l2 4.3 4.7.5-3.5 3.1 1 4.6L9 12.2l-4.2 2.3 1-4.6L2.3 6.8 7 6.3z" fill="currentColor"></path></svg></button>
    <a href="#" aria-label="Open in new tab" data-copy="COPY-tool.openNewTab" style="width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--surface2); border: 1px solid var(--lineStrong); border-radius: 10px; color: var(--fg)"><svg width="15" height="15" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4 2h6v6M10 2L3 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></a>
  </div>
  <main id="main" style="flex: 1 1 auto; display: flex; flex-direction: column">
  <section aria-label="JSON Formatter (embedded tool)" style="flex: 1 1 auto; display: flex; flex-direction: column; background: #FFFFFF; color: #1F2328; font-family: system-ui, sans-serif">
    <div style="padding: 8px 12px; background: #F6F8FA; border-bottom: 1px solid #D0D7DE; font: 400 12px 'JetBrains Mono', monospace; color: #57606A">[embedded tool: json.tarokit.app]</div>
    <pre style="margin: 0; padding: 14px; font: 13px/1.6 'JetBrains Mono', monospace; white-space: pre-wrap; border-bottom: 1px solid #D0D7DE">{"name":"TaroKit","tools":12}</pre>
    <pre style="margin: 0; padding: 14px; font: 13px/1.6 'JetBrains Mono', monospace; white-space: pre-wrap">{
  "name": "TaroKit",
  "tools": 12
}</pre>
  </section>
  </main>
  <p style="margin: 0; padding: 8px 12px; font: 400 12px 'JetBrains Mono', monospace; color: var(--muted); background: var(--bg)">On mobile the shell bar is hidden in the tool view. The tool header takes its place, with every action an icon button labeled for screen readers.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { themeCls: theme === 'light' ? 'tk-light' : 'tk-dark' };
  }
}
</script>
</body>
</html>
