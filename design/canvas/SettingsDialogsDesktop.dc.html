<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings dialogs, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--tint:#251A3C;--danger:#FF8595;--chrome:#140F1EB8;--scrim:#07050BB3;--glowShadow:0 30px 80px -30px #7846FF73}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--tint:#EEE7FE;--danger:#C0243B;--chrome:#FFFFFFD1;--scrim:#16111F66;--glowShadow:0 30px 70px -30px #5028C84D}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; box-sizing: border-box; min-height: 1100px; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 16px 24px 48px; overflow: hidden">
  <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px">
    <header style="display: flex; align-items: center; min-height: 56px; padding: 0 16px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px">
      <a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; font: 600 14px Unbounded, sans-serif; letter-spacing: 0.02em"><span style="width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--onAccent); display: inline-flex; align-items: center; justify-content: center; font: 700 12px Unbounded, sans-serif">T</span>TAROKIT</a>
    </header>
    <main id="main" style="display: flex; flex-direction: column; gap: 20px; max-width: 760px; padding: 16px 8px 0">
      <h1 data-copy="COPY-settings.title" style="margin: 0; font: 600 44px/1.1 Unbounded, sans-serif; letter-spacing: -0.03em">Settings</h1>
      <section style="display: flex; flex-direction: column; gap: 16px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
        <h2 data-copy="COPY-settings.yourData" style="margin: 0; font: 600 17px Unbounded, sans-serif">Your data</h2>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <button type="button" data-copy="COPY-settings.export" style="min-height: 44px; padding: 0 18px; background: var(--accent); color: var(--onAccent); border: 0; border-radius: 10px; font: 700 14px Manrope, sans-serif">Export your data</button>
          <button type="button" data-copy="COPY-settings.import" style="min-height: 44px; padding: 0 18px; background: transparent; color: var(--fg); border: 1px solid var(--lineStrong); border-radius: 10px; font: 700 14px Manrope, sans-serif">Import from file</button>
        </div>
        <sc-if value="{{importError}}" hint-placeholder-val="{{false}}">
          <div role="alert" style="display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border: 1px solid var(--danger); border-radius: 10px">
            <span aria-hidden="true" style="font: 700 15px 'JetBrains Mono', monospace; color: var(--danger)">!</span>
            <span data-copy="COPY-settings.importInvalid" style="font-size: 15px; line-height: 1.5">I couldn't import that file because <span data-copy="COPY-import.newerVersion">it came from a newer version of TaroKit</span>. Nothing changed.</span>
          </div>
        </sc-if>
        <div style="display: flex; flex-wrap: wrap; gap: 12px">
          <button type="button" data-copy="COPY-settings.clearRecents" style="min-height: 44px; padding: 0 18px; background: transparent; color: var(--fg); border: 1px solid var(--lineStrong); border-radius: 10px; font: 700 14px Manrope, sans-serif">Clear recent tools</button>
          <button type="button" data-copy="COPY-settings.erase" style="min-height: 44px; padding: 0 18px; background: transparent; color: var(--danger); border: 1px solid var(--danger); border-radius: 10px; font: 700 14px Manrope, sans-serif">Erase your data</button>
        </div>
      </section>
    </main>
  </div>
  <sc-if value="{{dialog}}" hint-placeholder-val="{{true}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
    <div role="alertdialog" aria-modal="true" aria-labelledby="dlg-t" style="position: absolute; top: 240px; left: 50%; transform: translateX(-50%); width: 480px; display: flex; flex-direction: column; gap: 18px; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--glowShadow)">
      <h2 id="dlg-t" data-copy="{{dlgCopy}}" style="margin: 0; font: 600 20px/1.35 Unbounded, sans-serif">{{dlgText}}</h2>
      <sc-if value="{{showFile}}" hint-placeholder-val="{{false}}"><span style="font: 400 13px 'JetBrains Mono', monospace; color: var(--muted)">tarokit-backup-2026-10-13.json</span></sc-if>
      <div style="display: flex; justify-content: flex-end; gap: 10px">
        <button type="button" data-copy="COPY-common.cancel" style="min-height: 44px; padding: 0 18px; background: transparent; color: var(--fg); border: 1px solid var(--lineStrong); border-radius: 10px; font: 700 14px Manrope, sans-serif; outline: 2px solid var(--accent); outline-offset: 2px">Cancel</button>
        <button type="button" data-copy="COPY-common.confirm" style="min-height: 44px; padding: 0 18px; background: {{confirmBg}}; color: {{confirmFg}}; border: 0; border-radius: 10px; font: 700 14px Manrope, sans-serif">Confirm</button>
      </div>
    </div>
  </sc-if>
  <p style="position: absolute; left: 24px; bottom: 16px; margin: 0; font: 400 12px 'JetBrains Mono', monospace; color: var(--muted)">State: {{state}} (switch in Tweaks). Focus starts on Cancel in every confirmation; Escape cancels.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["import error","import confirm","clear recents confirm","erase confirm"],"default":"erase confirm"},"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const state = this.props.state ?? 'erase confirm';
    const d = {
      'import confirm': ['COPY-settings.importConfirm', 'Replace your favorites, recents, theme and days used with the ones in this file?', false],
      'clear recents confirm': ['COPY-settings.clearRecentsConfirm', 'Clear your recent tools?', false],
      'erase confirm': ['COPY-settings.eraseConfirm', "Erase all your TaroKit data on this device? This can't be undone.", true]
    }[state];
    return {
      state: state,
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      importError: state === 'import error',
      dialog: !!d,
      dlgCopy: d ? d[0] : '', dlgText: d ? d[1] : '',
      showFile: state === 'import confirm',
      confirmBg: d && d[2] ? 'var(--danger)' : 'var(--accent)',
      confirmFg: d && d[2] ? 'var(--bg)' : 'var(--onAccent)'
    };
  }
}
</script>
</body>
</html>
