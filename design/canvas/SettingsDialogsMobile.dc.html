<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings erase confirmation, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--danger:#FF8595;--chrome:#140F1EB8;--scrim:#07050BB3}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--danger:#C0243B;--chrome:#FFFFFFD1;--scrim:#16111F66}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 12px 16px">
  <div aria-hidden="true" style="display: flex; flex-direction: column; gap: 16px">
    <div style="height: 56px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px"></div>
    <span style="font: 600 28px/1.1 Unbounded, sans-serif">Settings</span>
    <div style="height: 120px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px"></div>
    <div style="height: 320px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px"></div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
  <div role="alertdialog" aria-modal="true" aria-labelledby="m-dlg" style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; gap: 16px; padding: 24px 20px 28px; background: var(--surface); border-top: 1px solid var(--line); border-radius: 14px 14px 0 0">
    <h2 id="m-dlg" data-copy="COPY-settings.eraseConfirm" style="margin: 0; font: 600 20px/1.35 Unbounded, sans-serif">Erase all your TaroKit data on this device? This can't be undone.</h2>
    <button type="button" data-copy="COPY-common.confirm" style="min-height: 52px; background: var(--danger); color: var(--bg); border: 0; border-radius: 12px; font: 700 15px Manrope, sans-serif">Confirm</button>
    <button type="button" data-copy="COPY-common.cancel" style="min-height: 52px; background: transparent; color: var(--fg); border: 1px solid var(--lineStrong); border-radius: 12px; font: 700 15px Manrope, sans-serif; outline: 2px solid var(--accent); outline-offset: 2px">Cancel</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return { themeCls: theme === 'light' ? 'tk-light' : 'tk-dark' };
  }
}
</script>
</body>
</html>
