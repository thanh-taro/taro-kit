<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tool view edge states, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--accent2:#FFB870;--tint:#251A3C;--sel:#2A1D47;--selLine:#4A3580}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--accent2:#B85E08;--tint:#EEE7FE;--sel:#F0EAFE;--selLine:#CDBBF8}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:16px;top:-60px}.skip:focus{top:12px}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">
  <a href="#main" class="skip" data-copy="COPY-shell.skip" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; background: var(--accent); color: var(--onAccent); border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; z-index: 2">Skip to content</a>
  <div role="toolbar" aria-label="Focus Timer tool" style="display: flex; align-items: center; gap: 2px; min-height: 56px; padding: 0 4px; background: var(--surface); border-bottom: 1px solid var(--line)">
    <a href="#" aria-label="Back" data-copy="COPY-tool.back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></a>
    <h1 style="margin: 0 0 0 4px; font: 600 15px Manrope, sans-serif">Focus Timer</h1>
    <button type="button" aria-label="Remove from favorites" aria-pressed="true" data-copy="COPY-fav.remove" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--accent2)"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2l2 4.3 4.7.5-3.5 3.1 1 4.6L9 12.2l-4.2 2.3 1-4.6L2.3 6.8 7 6.3z" fill="currentColor"></path></svg></button>
    <a href="#" aria-label="Open in new tab" data-copy="COPY-tool.openNewTab" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: {{openBg}}; color: {{openFg}}"><svg width="15" height="15" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4 2h6v6M10 2L3 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></a>
  </div>
  <sc-if value="{{slow}}" hint-placeholder-val="{{false}}">
    <div role="status" data-copy="COPY-tool.slow" style="padding: 12px 16px; background: var(--sel); border-bottom: 1px solid var(--selLine); font-size: 14px; line-height: 1.45">Focus Timer is taking its time. You can open it in a new tab instead.</div>
  </sc-if>
  <main id="main" style="flex: 1 1 auto; display: flex; align-items: center; justify-content: center; padding: 24px">
    <sc-if value="{{loading}}" hint-placeholder-val="{{false}}">
      <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 12px"><span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent)"></span><span data-copy="COPY-tool.loading" style="font-size: 15px; color: var(--muted)">Getting Focus Timer ready…</span></div>
    </sc-if>
    <sc-if value="{{offline}}" hint-placeholder-val="{{true}}">
      <div role="status" style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
        <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 14px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center"><svg width="24" height="24" viewBox="0 0 16 16" fill="none"><path d="M2 5.5a9 9 0 0112 0M4.3 8.2a5.6 5.6 0 017.4 0M6.7 10.8a2.2 2.2 0 012.6 0M2 2l12 12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></span>
        <h2 data-copy="COPY-tool.offline" style="margin: 0; font: 600 17px/1.4 Unbounded, sans-serif">Focus Timer needs the internet. I'll load it as soon as you're back online.</h2>
      </div>
    </sc-if>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["loading","slow","offline"],"default":"offline"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const state = this.props.state ?? 'offline';
    const slow = state === 'slow';
    return {
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      slow: slow, offline: state === 'offline', loading: state !== 'offline',
      openBg: slow ? 'var(--accent)' : 'var(--surface2)', openFg: slow ? 'var(--onAccent)' : 'var(--fg)'
    };
  }
}
</script>
</body>
</html>
