<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalog, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--accent2:#FFB870;--tint:#251A3C;--chrome:#140F1EB8;--catVioletBg:#251A3C;--catVioletFg:#C4A6FF;--catMangoBg:#33240F;--catMangoFg:#FFC48A;--catSkyBg:#0F2738;--catSkyFg:#8CCBFF;--catMintBg:#0F2C25;--catMintFg:#7FE3B8}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--accent2:#B85E08;--tint:#EEE7FE;--chrome:#FFFFFFD1;--catVioletBg:#EEE7FE;--catVioletFg:#5B2FCC;--catMangoBg:#FDEBD8;--catMangoFg:#8F4705;--catSkyBg:#E0F0FD;--catSkyFg:#0B5A94;--catMintBg:#DDF5EA;--catMintFg:#0B6B49}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.stretch::after{content:"";position:absolute;inset:0;border-radius:12px}
.skip{position:absolute;left:16px;top:-60px}.skip:focus{top:12px}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; width: 390px; height: 1700px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 20px">
  <a href="#main" class="skip" data-copy="COPY-shell.skip" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; background: var(--accent); color: var(--onAccent); border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; z-index: 2">Skip to content</a>
  <header style="display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 4px 0 14px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px">
    <a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; font: 600 13px Unbounded, sans-serif; letter-spacing: 0.02em"><span style="width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--onAccent); display: inline-flex; align-items: center; justify-content: center; font: 700 12px Unbounded, sans-serif">T</span>TAROKIT</a>
    <button type="button" aria-label="{{toggleLabel}}" data-copy="COPY-shell.themeToggle" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M15 10.5A6.5 6.5 0 017.5 3a6.5 6.5 0 107.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></button>
    <nav aria-label="Main" style="display: contents"><button type="button" aria-expanded="false" data-copy="COPY-nav.menu" style="min-height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); font: 600 13px Manrope, sans-serif">Menu</button></nav>
  </header>
  <main id="main" style="display: flex; flex-direction: column; gap: 20px">
    <h1 data-copy="COPY-catalog.title" style="margin: 0; font: 600 28px/1.1 Unbounded, sans-serif; letter-spacing: -0.03em">My tools</h1>
    <div style="display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid var(--lineStrong); border-radius: 12px">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="color: var(--muted)"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <label for="mc-q" class="sr" data-copy="COPY-catalog.searchPlaceholder">Filter my tools</label>
      <input id="mc-q" type="search" placeholder="Filter my tools" style="flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); font: 500 16px Manrope, sans-serif">
    </div>
    <p aria-live="polite" data-copy="COPY-category.toolCount" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">9 tools</p>
    <nav aria-label="Categories" data-copy="COPY-category.navLabel" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <a href="#" aria-label="{{c.name}}, {{c.countText}}" style="flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 14px; background: var(--surface); border: 1px solid var(--line); white-space: nowrap"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font: 700 12px 'JetBrains Mono', monospace">{{c.icon}}</span>{{c.name}}</a>
      </sc-for>
    </nav>
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
      <section aria-labelledby="{{c.id}}" style="display: flex; flex-direction: column; gap: 10px">
        <h2 id="{{c.id}}" style="margin: 0; display: flex; align-items: center; gap: 10px; font: 600 17px Unbounded, sans-serif"><span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 10px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font: 700 12px 'JetBrains Mono', monospace">{{c.icon}}</span><a href="#" style="text-decoration: none; min-height: 44px; display: inline-flex; align-items: center">{{c.name}} <span aria-hidden="true" style="color: var(--muted); margin-left: 6px">›</span></a></h2>
        <sc-for list="{{c.tools}}" as="t" hint-placeholder-count="2">
          <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 6px 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
            <span style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 13px 'JetBrains Mono', monospace">{{t.icon}}</span>
            <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto">
              <a href="#" class="stretch" style="text-decoration: none; font-weight: 700; font-size: 15px">{{t.name}}<span aria-hidden="true" style="color: var(--muted); font-weight: 400">{{t.ext}}</span><span class="sr" data-copy="COPY-tool.opensNewTab">{{t.sr}}</span></a>
              <span style="font-size: 13px; color: var(--muted); line-height: 1.4">{{t.summary}}</span>
            </div>
            <button type="button" aria-label="{{t.favLabel}}" aria-pressed="{{t.fav}}" style="position: relative; z-index: 1; width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: {{t.starColor}}"><svg width="16" height="16" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2l2 4.3 4.7.5-3.5 3.1 1 4.6L9 12.2l-4.2 2.3 1-4.6L2.3 6.8 7 6.3z" fill="{{t.fill}}" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
          </div>
        </sc-for>
      </section>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const tool = (icon, name, summary, fav, linked) => ({ icon: icon, name: name, summary: summary, fav: fav ? 'true' : 'false',
      favLabel: fav ? 'Remove from favorites' : 'Add to favorites', starColor: fav ? 'var(--accent2)' : 'var(--muted)', fill: fav ? 'currentColor' : 'none',
      ext: linked ? ' ↗' : '', sr: linked ? ' (opens in a new tab)' : '' });
    return {
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      toggleLabel: theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme',
      cats: [
        { id: 'm-dev', countText: '3 tools', name: 'Developer tools', icon: '</>', bg: 'var(--catVioletBg)', fg: 'var(--catVioletFg)', tools: [tool('64', 'Base64', 'Encode and decode Base64.'), tool('{ }', 'JSON Formatter', 'Pretty-print and validate JSON.', true), tool('.*', 'Regex Tester', 'Live matches with explanations.')] },
        { id: 'm-media', countText: '2 tools', name: 'Media tools', icon: '▶', bg: 'var(--catMangoBg)', fg: 'var(--catMangoFg)', tools: [tool('♪', 'Audio Trimmer', 'Cut and fade audio clips.'), tool('▣', 'Clip Maker', 'Short social clips from videos.')] },
        { id: 'm-conv', countText: '3 tools', name: 'Converters & calculators', icon: '⇄', bg: 'var(--catSkyBg)', fg: 'var(--catSkyFg)', tools: [tool('◉', 'Color Picker', 'Pick, convert, check contrast.', true), tool('%', 'Loan Calculator', 'Monthly payment and schedule.', false, true), tool('⇄', 'Unit Converter', 'Length, weight, temperature.', true)] },
        { id: 'm-prod', countText: '1 tool', name: 'Productivity & relax', icon: '✓', bg: 'var(--catMintBg)', fg: 'var(--catMintFg)', tools: [tool('◷', 'Focus Timer', 'Pomodoro with gentle sounds.', true)] }
      ]
    };
  }
}
</script>
</body>
</html>
