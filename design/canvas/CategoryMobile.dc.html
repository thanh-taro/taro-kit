<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category page, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--tint:#251A3C;--chrome:#140F1EB8;--catVioletBg:#251A3C;--catVioletFg:#C4A6FF;--catMangoBg:#33240F;--catMangoFg:#FFC48A;--catSkyBg:#0F2738;--catSkyFg:#8CCBFF;--catMintBg:#0F2C25;--catMintFg:#7FE3B8}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--tint:#EEE7FE;--chrome:#FFFFFFD1;--catVioletBg:#EEE7FE;--catVioletFg:#5B2FCC;--catMangoBg:#FDEBD8;--catMangoFg:#8F4705;--catSkyBg:#E0F0FD;--catSkyFg:#0B5A94;--catMintBg:#DDF5EA;--catMintFg:#0B6B49}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.stretch::after{content:"";position:absolute;inset:0;border-radius:12px}
.skip{position:absolute;left:16px;top:-60px}.skip:focus{top:12px}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; width: 390px; height: 1400px; box-sizing: border-box; overflow: hidden; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 20px">
  <a href="#main" class="skip" data-copy="COPY-shell.skip" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; background: var(--accent); color: var(--onAccent); border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; z-index: 2">Skip to content</a>
  <header style="display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 4px 0 14px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px">
    <a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; font: 600 13px Unbounded, sans-serif; letter-spacing: 0.02em"><span style="width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--onAccent); display: inline-flex; align-items: center; justify-content: center; font: 700 12px Unbounded, sans-serif">T</span>TAROKIT</a>
    <button type="button" aria-label="{{toggleLabel}}" data-copy="COPY-shell.themeToggle" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M15 10.5A6.5 6.5 0 017.5 3a6.5 6.5 0 107.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></button>
    <nav aria-label="Main" style="display: contents"><button type="button" aria-expanded="false" data-copy="COPY-nav.menu" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); font: 600 13px Manrope, sans-serif">Menu</button></nav>
  </header>
  <main id="main" style="display: flex; flex-direction: column; gap: 18px">
    <section aria-labelledby="mc-name" style="display: flex; flex-direction: column; gap: 12px; padding: 22px; background: var(--catMangoBg); border-radius: 14px">
      <span aria-hidden="true" style="width: 56px; height: 56px; border-radius: 12px; background: var(--surface); color: var(--catMangoFg); display: flex; align-items: center; justify-content: center; font: 700 20px 'JetBrains Mono', monospace">▶</span>
      <h1 id="mc-name" style="margin: 0; font: 600 28px/1.1 Unbounded, sans-serif; letter-spacing: -0.03em">Media tools</h1>
      <p style="margin: 0; font-size: 15px; line-height: 1.55">I make small tools for images, video and sound, mostly so I can post something without opening a heavy editor.</p>
      <span data-copy="COPY-category.toolCount" style="font: 500 13px 'JetBrains Mono', monospace; color: var(--catMangoFg)">3 tools</span>
    </section>
    <nav aria-label="Categories" data-copy="COPY-category.navLabel" style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 0 16px 4px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <a href="#" aria-current="{{c.cur}}" style="flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 14px; white-space: nowrap; background: {{c.pillBg}}; color: {{c.pillFg}}; box-shadow: {{c.ring}}"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: {{c.iconBg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font: 700 12px 'JetBrains Mono', monospace">{{c.icon}}</span>{{c.name}}</a>
      </sc-for>
      <a href="#" data-copy="COPY-category.allTools" style="flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; color: var(--accent); font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap">All my tools</a>
    </nav>
    <sc-for list="{{tools}}" as="t" hint-placeholder-count="3">
      <div style="position: relative; display: flex; align-items: center; gap: 12px; padding: 12px 6px 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
        <span style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 13px 'JetBrains Mono', monospace">{{t.icon}}</span>
        <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto">
          <a href="#" class="stretch" style="text-decoration: none; font-weight: 700; font-size: 15px">{{t.name}}</a>
          <span style="font-size: 13px; color: var(--muted)">{{t.summary}}</span>
        </div>
        <button type="button" aria-label="Add to favorites" aria-pressed="false" data-copy="COPY-fav.add" style="position: relative; z-index: 1; width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted)"><svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M9 2l2 4.3 4.7.5-3.5 3.1 1 4.6L9 12.2l-4.2 2.3 1-4.6L2.3 6.8 7 6.3z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"></path></svg></button>
      </div>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const cat = (name, icon, bg, fg, cur) => ({ name: name, icon: icon, fg: fg, cur: cur ? 'page' : 'false',
      pillBg: cur ? bg : 'var(--surface)', pillFg: cur ? fg : 'var(--fg)', iconBg: cur ? 'var(--surface)' : bg,
      ring: cur ? 'inset 0 0 0 1px ' + fg : 'inset 0 0 0 1px var(--line)' });
    return {
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      toggleLabel: theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme',
      cats: [
        cat('Developer tools', '</>', 'var(--catVioletBg)', 'var(--catVioletFg)'),
        cat('Media tools', '▶', 'var(--catMangoBg)', 'var(--catMangoFg)', true),
        cat('Converters & calculators', '⇄', 'var(--catSkyBg)', 'var(--catSkyFg)'),
        cat('Productivity & relax', '✓', 'var(--catMintBg)', 'var(--catMintFg)')
      ],
      tools: [
        { icon: '♪', name: 'Audio Trimmer', summary: 'Cut and fade audio clips.' },
        { icon: '▣', name: 'Clip Maker', summary: 'Short social clips from videos.' },
        { icon: '⤢', name: 'Image Resizer', summary: 'Resize and compress images.' }
      ]
    };
  }
}
</script>
</body>
</html>
