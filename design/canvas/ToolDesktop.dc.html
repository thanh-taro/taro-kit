<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tool view, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--glow:#2A1850;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--accent2:#FFB870;--tint:#251A3C;--chrome:#140F1EB8}
.tk-light{--bg:#FBFAFE;--glow:#F4F0FF;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--accent2:#B85E08;--tint:#EEE7FE;--chrome:#FFFFFFD1}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</helmet>
<div class="{{themeCls}}" style="box-sizing: border-box; min-height: 960px; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px">
  <header style="display: flex; align-items: center; gap: 14px; min-height: 52px; padding: 0 4px 0 12px; background: var(--chrome); border: 1px solid var(--line); border-radius: 10px">
    <a href="#" aria-label="TaroKit home" data-copy="COPY-nav.home" style="width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--onAccent); display: inline-flex; align-items: center; justify-content: center; font: 700 12px Unbounded, sans-serif; text-decoration: none">T</a>
    <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 6px 0 10px; background: var(--surface); color: var(--muted); border: 1px solid var(--lineStrong); border-radius: 10px; font: 500 13px Manrope, sans-serif; width: 240px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg><span data-copy="COPY-palette.placeholder">What are you looking for?</span><span style="margin-left: auto; font: 500 12px 'JetBrains Mono', monospace; color: var(--fg); background: var(--surface2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; padding: 1px 6px">⌘K</span></button>
    <button type="button" aria-label="{{toggleLabel}}" data-copy="COPY-shell.themeToggle" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted)"><svg width="16" height="16" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M15 10.5A6.5 6.5 0 017.5 3a6.5 6.5 0 107.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></button>
  </header>
  <main id="main" style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 10px">
  <div role="toolbar" aria-label="JSON Formatter tool" style="display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 0 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px">
    <a href="#" data-copy="COPY-tool.back" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; color: var(--muted); text-decoration: none; font-size: 14px; border-radius: 10px"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>Back</a>
    <span style="width: 1px; height: 24px; background: var(--line)"></span>
    <span style="width: 26px; height: 26px; border-radius: 7px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 12px 'JetBrains Mono', monospace">{ }</span>
    <h1 style="margin: 0; font: 600 15px Manrope, sans-serif">JSON Formatter</h1>
    <button type="button" aria-label="Remove from favorites" aria-pressed="true" data-copy="COPY-fav.remove" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--accent2)"><svg width="17" height="17" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2l2 4.3 4.7.5-3.5 3.1 1 4.6L9 12.2l-4.2 2.3 1-4.6L2.3 6.8 7 6.3z" fill="currentColor"></path></svg></button>
    <a href="#" data-copy="COPY-tool.openNewTab" style="margin-left: auto; display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; text-decoration: none; font-size: 14px; font-weight: 600; background: var(--surface2); border: 1px solid var(--lineStrong); border-radius: 10px">Open in new tab<svg width="13" height="13" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M4 2h6v6M10 2L3 9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg></a>
  </div>
  <section aria-label="JSON Formatter (embedded tool)" style="flex: 1 1 auto; min-height: 760px; display: flex; flex-direction: column; background: #FFFFFF; color: #1F2328; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-family: system-ui, sans-serif">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: #F6F8FA; border-bottom: 1px solid #D0D7DE; font-size: 13px"><span style="font-weight: 600">json.tarokit.app</span><span style="font: 400 12px 'JetBrains Mono', monospace; color: #57606A">[embedded tool: its own site and styling, not designed here]</span></div>
    <div style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
      <pre style="margin: 0; padding: 16px; font: 13px/1.6 'JetBrains Mono', monospace; border-right: 1px solid #D0D7DE; white-space: pre-wrap">{"name":"TaroKit","tools":12,"offline":true}</pre>
      <pre style="margin: 0; padding: 16px; font: 13px/1.6 'JetBrains Mono', monospace; white-space: pre-wrap">{
  "name": "TaroKit",
  "tools": 12,
  "offline": true
}</pre>
    </div>
  </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return {
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      toggleLabel: theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme'
    };
  }
}
</script>
</body>
</html>
