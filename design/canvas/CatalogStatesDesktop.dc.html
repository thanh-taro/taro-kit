<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalog edge states, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--tint:#251A3C;--chrome:#140F1EB8}
.tk-dark{--catVioletBg:#251A3C;--catVioletFg:#C4A6FF;--catMangoBg:#33240F;--catMangoFg:#FFC48A;--catSkyBg:#0F2738;--catSkyFg:#8CCBFF;--catMintBg:#0F2C25;--catMintFg:#7FE3B8}
.tk-light{--catVioletBg:#EEE7FE;--catVioletFg:#5B2FCC;--catMangoBg:#FDEBD8;--catMangoFg:#8F4705;--catSkyBg:#E0F0FD;--catSkyFg:#0B5A94;--catMintBg:#DDF5EA;--catMintFg:#0B6B49}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--tint:#EEE7FE;--chrome:#FFFFFFD1}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-60px}.skip:focus{top:12px}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; box-sizing: border-box; min-height: 1000px; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 16px 24px 48px">
  <a href="#main" class="skip" data-copy="COPY-shell.skip" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; background: var(--accent); color: var(--onAccent); border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; z-index: 2">Skip to content</a>
  <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; min-height: 56px; padding: 0 8px 0 16px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px"><a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; font: 600 14px Unbounded, sans-serif; letter-spacing: 0.02em"><span style="width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--onAccent); display: inline-flex; align-items: center; justify-content: center; font: 700 12px Unbounded, sans-serif">T</span>TAROKIT</a><nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px; font-size: 14px"><a href="#" data-copy="COPY-nav.home" style="color: var(--muted); background: transparent; font-weight: 500; text-decoration: none; padding: 0 12px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 7px">Home</a><a href="#" aria-current="page" data-copy="COPY-nav.tools" style="color: var(--fg); background: var(--surface2); font-weight: 600; text-decoration: none; padding: 0 12px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 7px">Tools</a><a href="#" data-copy="COPY-nav.about" style="color: var(--muted); background: transparent; font-weight: 500; text-decoration: none; padding: 0 12px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 7px">About me</a><a href="#" data-copy="COPY-nav.now" style="color: var(--muted); background: transparent; font-weight: 500; text-decoration: none; padding: 0 12px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 7px">Now</a></nav><div style="margin-left: auto; display: flex; align-items: center; gap: 4px"><button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px 0 12px; background: var(--surface); color: var(--muted); border: 1px solid var(--lineStrong); border-radius: 10px; font: 500 13px Manrope, sans-serif; width: 240px"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg><span data-copy="COPY-palette.placeholder">What are you looking for?</span><span style="margin-left: auto; font: 500 12px 'JetBrains Mono', monospace; color: var(--fg); background: var(--surface2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; padding: 1px 6px">⌘K</span></button><button type="button" aria-label="{{toggleLabel}}" data-copy="COPY-shell.themeToggle" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M15 10.5A6.5 6.5 0 017.5 3a6.5 6.5 0 107.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></button><a href="#" aria-label="Settings" data-copy="COPY-nav.settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted); background: transparent; border-radius: 10px"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"></circle><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg></a></div></header>
    <main id="main" style="display: flex; flex-direction: column; gap: 24px; padding: 16px 8px 0">
      <div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
        <h1 data-copy="COPY-catalog.title" style="margin: 0; font: 600 44px/1.1 Unbounded, sans-serif; letter-spacing: -0.03em">My tools</h1>
        <div style="display: flex; align-items: center; gap: 10px; width: 360px; min-height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid {{searchBorder}}; border-radius: 12px">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="color: var(--muted)"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
          <label for="cs-q" class="sr" data-copy="COPY-catalog.searchPlaceholder">Filter my tools</label>
          <input id="cs-q" type="search" value="{{query}}" placeholder="Filter my tools" style="flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); font: 500 16px Manrope, sans-serif">
        </div>
      </div>
      <sc-if value="{{noResults}}" hint-placeholder-val="{{true}}"><nav aria-label="Categories" data-copy="COPY-category.navLabel" style="display: flex; flex-wrap: wrap; gap: 8px"><sc-for list="{{cats}}" as="c" hint-placeholder-count="4"><a href="#" aria-label="{{c.name}}, {{c.count}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px 0 6px; border-radius: 999px; text-decoration: none; font-weight: 600; font-size: 14px; background: var(--surface); border: 1px solid var(--line)"><span aria-hidden="true" style="width: 30px; height: 30px; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; display: flex; align-items: center; justify-content: center; font: 700 12px 'JetBrains Mono', monospace">{{c.icon}}</span>{{c.name}}</a></sc-for></nav></sc-if>
      <p aria-live="polite" data-copy="COPY-category.toolCount" class="sr">0 tools</p>
      <div role="status" style="align-self: center; display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 520px; padding: 64px 16px; text-align: center">
        <span aria-hidden="true" style="width: 64px; height: 64px; border-radius: 14px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 28px 'JetBrains Mono', monospace">{{icon}}</span>
        <h2 data-copy="{{titleCopy}}" style="margin: 0; font: 600 20px/1.35 Unbounded, sans-serif">{{title}}</h2>
        <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
          <button type="button" data-copy="COPY-catalog.clear" style="min-height: 44px; padding: 0 18px; background: var(--accent); color: var(--onAccent); border: 0; border-radius: 10px; font: 700 14px Manrope, sans-serif">Clear search</button>
        </sc-if>
      </div>
    </main>
    <p style="margin: 0; padding: 0 8px; font: 400 12px 'JetBrains Mono', monospace; color: var(--muted)">State: {{state}} (switch in Tweaks). In the empty state the category navigation is hidden, because there are no visible categories (RULE-06).</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["no results","empty"],"default":"no results"},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const state = this.props.state ?? 'no results';
    const nr = state === 'no results';
    return {
      state: state,
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      toggleLabel: theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme',
      noResults: nr,
      cats: [
        { name: 'Developer tools', icon: '</>', bg: 'var(--catVioletBg)', fg: 'var(--catVioletFg)', count: '3 tools' },
        { name: 'Media tools', icon: '▶', bg: 'var(--catMangoBg)', fg: 'var(--catMangoFg)', count: '2 tools' },
        { name: 'Converters & calculators', icon: '⇄', bg: 'var(--catSkyBg)', fg: 'var(--catSkyFg)', count: '3 tools' },
        { name: 'Productivity & relax', icon: '✓', bg: 'var(--catMintBg)', fg: 'var(--catMintFg)', count: '1 tool' }
      ],
      query: nr ? 'pdf' : '',
      searchBorder: nr ? 'var(--accent)' : 'var(--lineStrong)',
      icon: nr ? '?' : '◌',
      titleCopy: nr ? 'COPY-catalog.noResults' : 'COPY-catalog.empty',
      title: nr ? "I don't have anything matching \"pdf\" yet." : "I'm still building my first tools. Check back soon."
    };
  }
}
</script>
</body>
</html>
