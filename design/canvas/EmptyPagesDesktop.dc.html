<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Empty Projects and Now, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--tint:#251A3C;--chrome:#140F1EB8}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--tint:#EEE7FE;--chrome:#FFFFFFD1}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:16px;top:-60px}.skip:focus{top:12px}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; box-sizing: border-box; min-height: 900px; background: var(--bg); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 16px 24px 48px">
  <a href="#main" class="skip" data-copy="COPY-shell.skip" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; background: var(--accent); color: var(--onAccent); border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; z-index: 2">Skip to content</a>
  <div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
    <header style="display: flex; flex-wrap: wrap; align-items: center; gap: 20px; min-height: 56px; padding: 0 8px 0 16px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px"><a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; font: 600 14px Unbounded, sans-serif; letter-spacing: 0.02em"><span style="width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--onAccent); display: inline-flex; align-items: center; justify-content: center; font: 700 12px Unbounded, sans-serif">T</span>TAROKIT</a><nav aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 2px; font-size: 14px"><sc-for list="{{navs}}" as="n" hint-placeholder-count="5"><a href="#" aria-current="{{n.cur}}" data-copy="{{n.copy}}" style="color: {{n.color}}; background: {{n.bg}}; text-decoration: none; padding: 0 12px; min-height: 44px; display: inline-flex; align-items: center; border-radius: 7px">{{n.label}}</a></sc-for></nav><div style="margin-left: auto; display: flex; align-items: center; gap: 4px"><button type="button" style="display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 6px 0 12px; background: var(--surface); color: var(--muted); border: 1px solid var(--lineStrong); border-radius: 10px; font: 500 13px Manrope, sans-serif; width: 240px"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg><span data-copy="COPY-palette.placeholder">What are you looking for?</span><span style="margin-left: auto; font: 500 12px 'JetBrains Mono', monospace; color: var(--fg); background: var(--surface2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; padding: 1px 6px">⌘K</span></button><button type="button" aria-label="{{toggleLabel}}" data-copy="COPY-shell.themeToggle" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M15 10.5A6.5 6.5 0 017.5 3a6.5 6.5 0 107.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></button><a href="#" aria-label="Settings" data-copy="COPY-nav.settings" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--muted); background: transparent; border-radius: 10px"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="9" cy="9" r="2.5" stroke="currentColor" stroke-width="1.5"></circle><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.7 3.7l1.4 1.4M12.9 12.9l1.4 1.4M3.7 14.3l1.4-1.4M12.9 5.1l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg></a></div></header>
    <main id="main" style="display: flex; flex-direction: column; gap: 24px; padding: 16px 8px 0">
      <h1 data-copy="{{titleCopy}}" style="margin: 0; font: 600 44px/1.1 Unbounded, sans-serif; letter-spacing: -0.03em">{{title}}</h1>
      <div role="status" style="align-self: flex-start; display: flex; align-items: flex-start; gap: 14px; max-width: 620px; padding: 22px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
        <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 15px 'JetBrains Mono', monospace">◌</span>
        <p data-copy="{{emptyCopy}}" style="margin: 0; font-size: 17px; line-height: 1.5; padding-top: 8px">{{empty}}</p>
      </div>
    </main>
    <p style="margin: 0; padding: 0 8px; font: 400 12px 'JetBrains Mono', monospace; color: var(--muted)">Page: {{page}} (switch in Tweaks). Now is empty only when there is no Now note and no visible tools; otherwise the changelog still shows (F-010.R4).</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"page":{"editor":"enum","options":["projects empty","now empty"],"default":"projects empty"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const page = this.props.page ?? 'projects empty';
    const proj = page === 'projects empty';
    const nav = (label, copy, cur) => ({ label: label, copy: copy, cur: cur ? 'page' : 'false', color: cur ? 'var(--fg)' : 'var(--muted)', bg: cur ? 'var(--surface2)' : 'transparent' });
    return {
      page: page,
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      toggleLabel: theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme',
      navs: [nav('Home', 'COPY-nav.home'), nav('Tools', 'COPY-nav.tools'), nav('Projects', 'COPY-nav.projects', proj), nav('About me', 'COPY-nav.about'), nav('Now', 'COPY-nav.now', !proj)],
      titleCopy: proj ? 'COPY-projects.title' : 'COPY-now.title',
      title: proj ? "Things I've built" : "What I'm up to",
      emptyCopy: proj ? 'COPY-projects.empty' : 'COPY-now.empty',
      empty: proj ? "I'm putting my projects together. Check back soon." : 'Nothing to share yet. Check back soon.'
    };
  }
}
</script>
</body>
</html>
