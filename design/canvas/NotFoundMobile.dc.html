<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Not found, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--glow:#2A1850;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--tint:#251A3C;--chrome:#140F1EB8}
.tk-light{--bg:#FBFAFE;--glow:#F4F0FF;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--tint:#EEE7FE;--chrome:#FFFFFFD1}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skip{position:absolute;left:16px;top:-60px}.skip:focus{top:12px}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: radial-gradient(90% 45% at 50% 40%, var(--glow) 0%, var(--bg) 75%); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 12px 16px 32px; display: flex; flex-direction: column">
  <a href="#main" class="skip" data-copy="COPY-shell.skip" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; background: var(--accent); color: var(--onAccent); border-radius: 10px; font-weight: 700; font-size: 14px; text-decoration: none; z-index: 2">Skip to content</a>
  <header style="display: flex; align-items: center; gap: 4px; min-height: 56px; padding: 0 4px 0 14px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px">
    <a href="#" style="display: flex; align-items: center; gap: 8px; text-decoration: none; font: 600 13px Unbounded, sans-serif; letter-spacing: 0.02em"><span style="width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: var(--onAccent); display: inline-flex; align-items: center; justify-content: center; font: 700 12px Unbounded, sans-serif">T</span>TAROKIT</a>
    <button type="button" aria-label="{{toggleLabel}}" data-copy="COPY-shell.themeToggle" style="margin-left: auto; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: transparent; border: 0; color: var(--muted)"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><path d="M15 10.5A6.5 6.5 0 017.5 3a6.5 6.5 0 107.5 7.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"></path></svg></button>
    <nav aria-label="Main" style="display: contents"><button type="button" aria-expanded="false" data-copy="COPY-nav.menu" style="min-height: 44px; display: flex; align-items: center; padding: 0 12px; background: var(--surface2); border: 1px solid var(--line); border-radius: 10px; color: var(--fg); font: 600 13px Manrope, sans-serif">Menu</button></nav>
  </header>
  <main id="main" style="flex: 1 1 auto; display: flex; flex-direction: column; justify-content: center; gap: 16px">
    <span aria-hidden="true" style="align-self: center; font: 600 72px/1 Unbounded, sans-serif; letter-spacing: -0.06em; color: var(--accent)">404</span>
    <div role="status" style="display: flex; align-items: flex-start; gap: 14px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px">
      <span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 15px 'JetBrains Mono', monospace">?</span>
      <div style="display: flex; flex-direction: column; gap: 6px; flex: 1 1 auto">
        <h1 data-copy="COPY-notFound.title" style="margin: 0; font: 600 20px/1.3 Unbounded, sans-serif">I can't find that page</h1>
        <p data-copy="COPY-notFound.body" style="margin: 0; font-size: 15px; line-height: 1.55; color: var(--muted)">It may have moved, or I took it down.</p>
        <a href="#" data-copy="COPY-notFound.toCatalog" style="display: flex; align-items: center; justify-content: center; min-height: 48px; margin-top: 6px; background: var(--accent); color: var(--onAccent); border-radius: 10px; font-weight: 700; text-decoration: none">Browse my tools</a>
        <a href="#" data-copy="COPY-nav.home" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border: 1px solid var(--lineStrong); border-radius: 10px; font-weight: 700; text-decoration: none">Home</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    return {
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      toggleLabel: theme === 'light' ? 'Switch to dark theme' : 'Switch to light theme'
    };
  }
}
</script>
</body>
</html>
