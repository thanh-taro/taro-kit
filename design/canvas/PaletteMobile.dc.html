<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palette, mobile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--tint:#251A3C;--sel:#2A1D47;--selLine:#4A3580}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--tint:#EEE7FE;--sel:#F0EAFE;--selLine:#CDBBF8}
mark{background:none;color:var(--accent);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="{{themeCls}}" role="dialog" aria-modal="true" aria-label="Search TaroKit" data-copy="COPY-palette.dialogLabel" style="width: 390px; height: 844px; box-sizing: border-box; overflow: hidden; background: var(--surface); color: var(--fg); font-family: Manrope, system-ui, sans-serif; display: flex; flex-direction: column">
  <div style="display: flex; align-items: center; gap: 8px; padding: 12px 8px 12px 16px; border-bottom: 1px solid var(--line)">
    <div style="flex: 1 1 auto; display: flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 12px; background: var(--bg); border: 1px solid var(--accent); border-radius: 12px">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="color: var(--muted)"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <label for="m-q" class="sr" data-copy="COPY-palette.placeholder">What are you looking for?</label>
      <input id="m-q" type="search" value="{{query}}" placeholder="What are you looking for?" style="flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); font: 500 15px Manrope, sans-serif">
    </div>
    <button type="button" data-copy="COPY-palette.close" style="min-height: 44px; padding: 0 10px; background: transparent; border: 0; color: var(--accent); font: 700 15px Manrope, sans-serif">Cancel</button>
  </div>
  <div role="listbox" aria-label="Results" style="flex: 1 1 auto; display: flex; flex-direction: column; padding: 8px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
      <div role="group" aria-label="{{g.title}}" style="display: flex; flex-direction: column; padding: 4px 0">
        <span data-copy="{{g.copy}}" style="font: 700 12px Manrope, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 8px">{{g.title}}</span>
        <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
          <div role="option" aria-selected="{{r.selected}}" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 10px; border-radius: 10px; background: {{r.bg}}; box-shadow: {{r.ring}}">
            <span style="width: 32px; height: 32px; flex: none; border-radius: 10px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 12px 'JetBrains Mono', monospace">{{r.icon}}</span>
            <span style="display: flex; flex-direction: column; min-width: 0">
              <span data-copy="{{r.copy}}" style="font-size: 15px; font-weight: 600">{{r.pre}}<mark>{{r.match}}</mark>{{r.post}}<span class="sr">{{r.sr}}</span></span>
              <span style="font-size: 12px; color: var(--muted)">{{r.sub}}</span>
            </span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
  <p style="margin: 0; padding: 12px 16px 20px; font: 400 12px 'JetBrains Mono', monospace; color: var(--muted)">Full-screen sheet on touch screens. No key hints. Cancel closes it.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["empty query","results"],"default":"results"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const state = this.props.state ?? 'results';
    const row = (icon, pre, match, post, sub, selected, copy, sr) => ({
      icon: icon, pre: pre, match: match, post: post, sub: sub, copy: copy || '', sr: sr || '', selected: selected ? 'true' : 'false',
      bg: selected ? 'var(--sel)' : 'transparent', ring: selected ? 'inset 0 0 0 1px var(--selLine)' : 'none'
    });
    const results = [
      { title: 'Tools', copy: 'COPY-palette.groupTools', rows: [row('{ }', '', 'JSON', ' Formatter', 'Pretty-print, validate and minify JSON.', true), row('⇆', '', 'JSON', ' to YAML', 'Convert between JSON and YAML.')] },
      { title: 'Actions', copy: 'COPY-palette.groupActions', rows: [row('⤓', 'Export your data', '', '', 'Save your favorites, recents and theme to a file.', false, 'COPY-palette.actionExport')] }
    ];
    const empty = [
      { title: 'Favorites', copy: 'COPY-palette.groupFavorites', rows: [row('{ }', 'JSON Formatter', '', '', '', true), row('⇄', 'Unit Converter', '', '', ''), row('◷', 'Focus Timer', '', '', '')] },
      { title: 'Recent', copy: 'COPY-palette.groupRecents', rows: [row('64', 'Base64', '', '', ''), row('%', 'Loan Calculator ↗', '', '', '', false, '', ' (opens in a new tab)')] },
      { title: 'Pages', copy: 'COPY-palette.groupPages', rows: [row('⌂', 'Home', '', '', '', false, 'COPY-nav.home'), row('▦', 'Tools', '', '', '', false, 'COPY-nav.tools'), row('☺', 'About me', '', '', '', false, 'COPY-nav.about')] }
    ];
    return {
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      query: state === 'results' ? 'json' : '',
      groups: state === 'results' ? results : empty
    };
  }
}
</script>
</body>
</html>
