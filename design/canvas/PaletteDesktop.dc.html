<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Palette over home, desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&amp;family=Manrope:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--glow:#2A1850;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--accent2:#FFB870;--tint:#251A3C;--sel:#2A1D47;--selLine:#4A3580;--chrome:#140F1EB8;--scrim:#07050BB3;--glowShadow:0 30px 80px -30px #7846FF73}
.tk-light{--bg:#FBFAFE;--glow:#F4F0FF;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--accent2:#B85E08;--tint:#EEE7FE;--sel:#F0EAFE;--selLine:#CDBBF8;--chrome:#FFFFFFD1;--scrim:#16111F66;--glowShadow:0 30px 70px -30px #5028C84D}
mark{background:none;color:var(--accent);font-weight:700}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; box-sizing: border-box; min-height: 1200px; background: radial-gradient(70% 45% at 85% 0%, var(--glow) 0%, var(--bg) 70%); color: var(--fg); font-family: Manrope, system-ui, sans-serif; padding: 16px 24px 48px; overflow: hidden">
  <div aria-hidden="true" style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
    <div style="height: 56px; background: var(--chrome); border: 1px solid var(--line); border-radius: 12px"></div>
    <div style="display: flex; flex-direction: column; gap: 14px; padding: 32px 8px 0">
      <span style="font: 500 13px 'JetBrains Mono', monospace; color: var(--muted)">Tue, 13 Oct · 08:42</span>
      <span style="font: 600 44px/1.1 Unbounded, sans-serif; letter-spacing: -0.03em">Good morning</span>
      <span style="font-size: 17px; color: var(--muted)">I'm Taro. Full-stack developer. I build small tools for work and life, and they all live here.</span>
      <div style="height: 56px; max-width: 640px; background: var(--surface); border: 1px solid var(--lineStrong); border-radius: 12px"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; padding: 0 8px">
      <div style="height: 104px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px"></div>
      <div style="height: 104px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px"></div>
      <div style="height: 104px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px"></div>
      <div style="height: 104px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px"></div>
    </div>
  </div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--scrim)"></div>
  <div role="dialog" aria-modal="true" aria-label="Search TaroKit" data-copy="COPY-palette.dialogLabel" style="position: absolute; top: 120px; left: 50%; transform: translateX(-50%); width: 640px; max-width: calc(100% - 32px); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--glowShadow); overflow: hidden">
    <div style="display: flex; align-items: center; gap: 10px; height: 60px; padding: 0 16px; border-bottom: 1px solid var(--line)">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="color: var(--muted)"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"></circle><path d="M11 11l3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <label for="pal-q" class="sr" data-copy="COPY-palette.placeholder">What are you looking for?</label>
      <input id="pal-q" type="text" value="{{query}}" placeholder="What are you looking for? (⌘K)" style="flex: 1 1 auto; min-width: 0; background: transparent; border: 0; outline: none; color: var(--fg); font: 500 17px Manrope, sans-serif">
      <span style="font: 500 12px 'JetBrains Mono', monospace; color: var(--muted); background: var(--surface2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; padding: 1px 6px">Esc</span>
    </div>
    <div role="listbox" aria-label="Results" style="display: flex; flex-direction: column; padding: 6px 8px 8px">
      <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
        <div role="group" aria-label="{{g.title}}" style="display: flex; flex-direction: column; padding: 4px 0">
          <span data-copy="{{g.copy}}" style="font: 700 12px Manrope, sans-serif; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 6px 8px">{{g.title}}</span>
          <sc-for list="{{g.rows}}" as="r" hint-placeholder-count="2">
            <div role="option" aria-selected="{{r.selected}}" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 10px; border-radius: 10px; background: {{r.bg}}; box-shadow: {{r.ring}}">
              <span style="width: 28px; height: 28px; flex: none; border-radius: 7px; background: var(--tint); color: var(--accent); display: flex; align-items: center; justify-content: center; font: 600 12px 'JetBrains Mono', monospace">{{r.icon}}</span>
              <span style="display: flex; flex-direction: column; min-width: 0">
                <span data-copy="{{r.copy}}" style="font-size: 15px; font-weight: 600">{{r.pre}}<mark>{{r.match}}</mark>{{r.post}}<span class="sr">{{r.sr}}</span></span>
                <span style="font-size: 12px; color: var(--muted)">{{r.sub}}</span>
              </span>
              <span style="margin-left: auto; font: 400 12px 'JetBrains Mono', monospace; color: var(--muted); white-space: nowrap">{{r.hint}}</span>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>
    <div data-copy="COPY-palette.hints" style="display: flex; gap: 16px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted)">
      <span><span style="font: 500 12px 'JetBrains Mono', monospace; color: var(--fg); background: var(--surface2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; padding: 0 5px">↑↓</span> to move</span>
      <span><span style="font: 500 12px 'JetBrains Mono', monospace; color: var(--fg); background: var(--surface2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; padding: 0 5px">Enter</span> to open</span>
      <span><span style="font: 500 12px 'JetBrains Mono', monospace; color: var(--fg); background: var(--surface2); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 7px; padding: 0 5px">Esc</span> to close</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"state":{"editor":"enum","options":["empty query","results"],"default":"results"},"$preview":{"width":1440,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'dark';
    const state = this.props.state ?? 'results';
    const row = (icon, pre, match, post, sub, hint, selected, copy, sr) => ({
      icon: icon, pre: pre, match: match, post: post, sub: sub, hint: hint, copy: copy || '', sr: sr || '',
      selected: selected ? 'true' : 'false',
      bg: selected ? 'var(--sel)' : 'transparent', ring: selected ? 'inset 0 0 0 1px var(--selLine)' : 'none'
    });
    const results = [
      { title: 'Tools', copy: 'COPY-palette.groupTools', rows: [
        row('{ }', '', 'JSON', ' Formatter', 'Pretty-print, validate and minify JSON.', 'Enter', true),
        row('⇆', '', 'JSON', ' to YAML', 'Convert between JSON and YAML.', '')
      ] },
      { title: 'Actions', copy: 'COPY-palette.groupActions', rows: [
        row('⤓', 'Export your data', '', '', 'Save your favorites, recents and theme to a file.', '', false, 'COPY-palette.actionExport')
      ] }
    ];
    const empty = [
      { title: 'Favorites', copy: 'COPY-palette.groupFavorites', rows: [
        row('{ }', 'JSON Formatter', '', '', '', 'Enter', true), row('⇄', 'Unit Converter', '', '', '', ''),
        row('◷', 'Focus Timer', '', '', '', ''), row('◉', 'Color Picker', '', '', '', '')
      ] },
      { title: 'Recent', copy: 'COPY-palette.groupRecents', rows: [
        row('64', 'Base64', '', '', '', ''), row('%', 'Loan Calculator ↗', '', '', '', '', false, '', ' (opens in a new tab)')
      ] },
      { title: 'Pages', copy: 'COPY-palette.groupPages', rows: [
        row('⌂', 'Home', '', '', '', '', false, 'COPY-nav.home'), row('▦', 'Tools', '', '', '', '', false, 'COPY-nav.tools'),
        row('☺', 'About me', '', '', '', '', false, 'COPY-nav.about')
      ] }
    ];
    return {
      themeCls: theme === 'light' ? 'tk-light' : 'tk-dark',
      query: state === 'results' ? 'json' : '',
      groups: state === 'results' ? results : empty
    };
  }
}
</script>
</body>
</html>
